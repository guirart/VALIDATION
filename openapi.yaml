openapi: 3.1.0
info:
  title: Veredicta API
  version: "3.0.0"
  description: Consulta casos existentes e envia análises auditadas ao Veredicta.

servers:
  - url: https://validation-six-tawny.vercel.app

paths:
  /api:
    get:
      operationId: consultarVeredicta
      summary: Consulta fontes e casos existentes.
      security:
        - VeredictaKey: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [source-status, gpt-cases, gpt-case]
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Consulta realizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_version:
                    type: string
                  validator_version:
                    type: string
                  legal_source_version:
                    type: string
                  memorandum_version:
                    type: string
                  mp_sha256:
                    type: string
                  memorandum_sha256:
                    type: string
                  contract_sha256:
                    type: string
                  instruction:
                    type: string
                  case:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      client_name:
                        type: string
                      contract_text:
                        type: string
                      status:
                        type: string
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        client_name:
                          type: string
                        status:
                          type: string
        "400":
          description: Requisição inválida.
        "401":
          description: Action não autorizada.
        "404":
          description: Não encontrado.
        "500":
          description: Erro interno.

    post:
      operationId: enviarAnaliseVeredicta
      summary: Envia análise auditada de caso existente.
      security:
        - VeredictaKey: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [gpt-analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, source_contract_sha256, analyst, audit]
              properties:
                case_id:
                  type: string
                source_contract_sha256:
                  type: string
                analyst:
                  type: object
                  required: [final_classification, summary, points]
                  properties:
                    final_classification:
                      type: string
                      enum: [enquadrável, parcialmente enquadrável, inconclusivo, não enquadrável]
                    summary:
                      type: string
                    points:
                      type: array
                      minItems: 15
                      maxItems: 15
                      items:
                        type: object
                        required: [point, title, legal_reference, evidence_status, legal_result, verdict, display_label, mp_quote, contract_quote, reasoning]
                        properties:
                          point:
                            type: integer
                            minimum: 1
                            maximum: 15
                          title:
                            type: string
                          legal_reference:
                            type: string
                          evidence_status:
                            type: string
                            enum: [comprovado, parcialmente_comprovado, nao_comprovado, nao_consta]
                          legal_result:
                            type: string
                            enum: [atende, nao_atende, inconclusivo, nao_aplicavel]
                          verdict:
                            type: string
                            enum: [atinge, parcial, atencao, ausente]
                          display_label:
                            type: string
                          mp_quote:
                            type: string
                          contract_quote:
                            type: string
                          reasoning:
                            type: string
                audit:
                  type: object
                  required: [final_classification, recommendation, summary, findings]
                  properties:
                    final_classification:
                      type: string
                      enum: [enquadrável, parcialmente enquadrável, inconclusivo, não enquadrável]
                    recommendation:
                      type: string
                      enum: [liberar, corrigir, escalar para revisão humana aprofundada]
                    summary:
                      type: string
                    findings:
                      type: array
                      minItems: 15
                      maxItems: 15
                      items:
                        type: object
                        required: [point, status, reason]
                        properties:
                          point:
                            type: integer
                            minimum: 1
                            maximum: 15
                          status:
                            type: string
                            enum: [confirmado, divergente, não encontrado, opinião sem precedente]
                          reason:
                            type: string
      responses:
        "200":
          description: Análise processada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  analysis_id:
                    type: string
                  case_id:
                    type: string
                  status:
                    type: string
                  quality_gate:
                    type: boolean
                  final_classification:
                    type: string
                  auditor_recommendation:
                    type: string
                  validation_errors:
                    type: array
                    items:
                      type: string
                  contract_sha256:
                    type: string
                  app_version:
                    type: string
                  validator_version:
                    type: string
                  stage:
                    type: string
                  failed_points:
                    type: array
                    items:
                      type: integer
                  validation_error_details:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                        point:
                          type: integer
                        message:
                          type: string
                        correctable:
                          type: boolean
                  validation_debug:
                    type: array
                    items:
                      type: object

                  next_step:
                    type: string
        "400":
          description: Dados inválidos.
        "401":
          description: Action não autorizada.
        "404":
          description: Caso não encontrado.
        "409":
          description: Hash do dossiê divergente.
        "500":
          description: Erro interno.

components:
  schemas: {}
  securitySchemes:
    VeredictaKey:
      type: apiKey
      in: header
      name: X-Veredicta-Key

security:
  - VeredictaKey: []
