openapi: 3.1.0

info:
  title: Veredicta API
  version: "3.6.0"
  description: API do Veredicta com consulta de casos, análises, histórico e importação sintética.

servers:
  - url: https://validation-six-tawny.vercel.app

paths:

  /api/gpt/source-status:
    get:
      operationId: consultarStatusVeredicta
      summary: Consulta status das fontes e versões.
      security:
        - VeredictaKey: []
      responses:
        "200":
          description: Status consultado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_version: {type: string}
                  validator_version: {type: string}
                  legal_source_version: {type: string}
                  memorandum_version: {type: string}
                  mp_sha256: {type: string}
                  memorandum_sha256: {type: string}
                  instruction: {type: string}

  /api/gpt/cases:
    get:
      operationId: listarCasosVeredicta
      summary: Lista casos cadastrados.
      security:
        - VeredictaKey: []
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Casos encontrados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        title: {type: string}
                        client_name: {type: string}
                        status: {type: string}
                        synthetic: {type: boolean}
                        environment: {type: string}
                        external_test_id: {type: string}
                        created_at: {type: string}
                        updated_at: {type: string}

  /api/gpt/case:
    get:
      operationId: buscarCasoVeredicta
      summary: Recupera caso e contract_sha256 atual.
      security:
        - VeredictaKey: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Caso recuperado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  case:
                    type: object
                    properties:
                      id: {type: string}
                      title: {type: string}
                      client_name: {type: string}
                      contract_text: {type: string}
                      status: {type: string}
                      synthetic: {type: boolean}
                      environment: {type: string}
                      external_test_id: {type: string}
                  contract_sha256: {type: string}
                  app_version: {type: string}
                  validator_version: {type: string}

  /api/gpt/analysis-history:
    get:
      operationId: listarHistoricoAnalisesVeredicta
      summary: Lista análises já gravadas para um caso.
      security:
        - VeredictaKey: []
      parameters:
        - name: case_id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Histórico recuperado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  case_id: {type: string}
                  analyses:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        case_id: {type: string}
                        final_classification: {type: string}
                        quality_gate: {type: boolean}
                        auditor_recommendation: {type: string}
                        created_at: {type: string}
                  app_version: {type: string}
                  validator_version: {type: string}

  /api/gpt/analysis-detail:
    get:
      operationId: buscarDetalheAnaliseVeredicta
      summary: Recupera análise armazenada e diagnóstico do quality gate.
      security:
        - VeredictaKey: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Análise recuperada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  analysis:
                    type: object
                    properties:
                      id: {type: string}
                      case_id: {type: string}
                      analyst:
                        type: object
                        properties:
                          final_classification: {type: string}
                          summary: {type: string}
                          points:
                            type: array
                            items:
                              type: object
                              properties:
                                point: {type: integer}
                                title: {type: string}
                                legal_reference: {type: string}
                                applicability:
                                  type: string
                                  enum: [aplicavel, nao_aplicavel, condicional]
                                evidence_status:
                                  type: string
                                  enum: [comprovado, parcialmente_comprovado, nao_comprovado, nao_consta, dispensado]
                                legal_result:
                                  type: string
                                  enum: [atende, nao_atende, inconclusivo, nao_aplicavel]
                                display_status:
                                  type: string
                                  description: "Estado visual derivado da taxonomia. Evento futuro ainda não exigível não deve virar parcial/atencao apenas por inexistência do documento futuro."
                                  enum: [atinge, parcial, atencao, nao_consta, nao_se_aplica]
                                verdict: {type: string, description: "Legado opcional; ignorado para o quality gate e sobrescrito pelo backend a partir de display_status."}
                                display_label: {type: string, description: "Derivado pelo backend a partir de display_status."}
                                mp_quote: {type: string}
                                contract_quote: {type: string}
                                reasoning: {type: string}
                      audit:
                        type: object
                        properties:
                          final_classification: {type: string}
                          recommendation: {type: string}
                          summary: {type: string}
                          findings:
                            type: array
                            items:
                              type: object
                              properties:
                                point: {type: integer}
                                status: {type: string}
                                reason: {type: string}
                      final_classification: {type: string}
                      quality_gate: {type: boolean}
                      auditor_recommendation: {type: string}
                      created_at: {type: string}
                  validation:
                    type: object
                    properties:
                      validation_errors:
                        type: array
                        items: {type: string}
                      validation_error_details:
                        type: array
                        items:
                          type: object
                          properties:
                            category: {type: string}
                            point: {type: integer}
                            message: {type: string}
                            correctable: {type: boolean}
                      quality_gate_reasons:
                        type: array
                        items: {type: string}
                      validation_debug:
                        type: array
                        items:
                          type: object
                          properties:
                            point: {type: integer}
                            literal_quote_found: {type: boolean}
                            silence_allowed: {type: boolean}
                            legal_reference_silence: {type: boolean}
                            reasoning_silence: {type: boolean}
                            quote_silence: {type: boolean}
                            result: {type: boolean}
                      failed_points:
                        type: array
                        items: {type: integer}
                  integrity:
                    type: object
                    properties:
                      contract_sha256: {type: string}
                      app_version: {type: string}
                      validator_version: {type: string}
                  app_version: {type: string}
                  validator_version: {type: string}
        "404":
          description: Análise não encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  error: {type: string}
                  analysis_id: {type: string}

  /api/gpt/analysis:
    post:
      operationId: enviarAnaliseVeredicta
      summary: Envia análise jurídica auditada.
      security:
        - VeredictaKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, source_contract_sha256, analyst, audit]
              properties:
                case_id: {type: string}
                source_contract_sha256: {type: string}
                analyst:
                  type: object
                  properties:
                    final_classification: {type: string}
                    summary: {type: string}
                    points:
                      type: array
                      items:
                        type: object
                        properties:
                          point: {type: integer}
                          title: {type: string}
                          legal_reference: {type: string}
                          applicability:
                            type: string
                            enum: [aplicavel, nao_aplicavel, condicional]
                          evidence_status:
                            type: string
                            enum: [comprovado, parcialmente_comprovado, nao_comprovado, nao_consta, dispensado]
                          legal_result:
                            type: string
                            enum: [atende, nao_atende, inconclusivo, nao_aplicavel]
                          display_status:
                            type: string
                            description: "Estado visual derivado da taxonomia. Evento futuro ainda não exigível não deve virar parcial/atencao apenas por inexistência do documento futuro."
                            enum: [atinge, parcial, atencao, nao_consta, nao_se_aplica]
                          verdict: {type: string, description: "Legado opcional; ignorado para o quality gate e sobrescrito pelo backend a partir de display_status."}
                          display_label: {type: string, description: "Derivado pelo backend."}
                          mp_quote: {type: string}
                          contract_quote: {type: string}
                          reasoning: {type: string}
                audit:
                  type: object
                  properties:
                    final_classification: {type: string}
                    recommendation: {type: string}
                    summary: {type: string}
                    findings:
                      type: array
                      items:
                        type: object
                        properties:
                          point: {type: integer}
                          status: {type: string}
                          reason: {type: string}
      responses:
        "200":
          description: Análise processada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  analysis_id: {type: string}
                  case_id: {type: string}
                  status: {type: string}
                  quality_gate: {type: boolean}
                  failed_points:
                    type: array
                    items: {type: integer}
                  app_version: {type: string}
                  validator_version: {type: string}

  /api/gpt/test-import:
    post:
      operationId: importarCasosSinteticosVeredicta
      summary: Importa casos sintéticos de teste.
      security:
        - VeredictaKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment, batch_id, cases]
              properties:
                environment:
                  type: string
                  enum: [test]
                batch_id: {type: string}
                cases:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [external_test_id, title, contract_text]
                    properties:
                      external_test_id: {type: string}
                      title: {type: string}
                      client_name: {type: string}
                      contract_text: {type: string}
      responses:
        "200":
          description: Importação processada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  total: {type: integer}
                  created: {type: integer}
                  adopted: {type: integer}
                  skipped: {type: integer}
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        external_test_id: {type: string}
                        case_id: {type: string}
                        title: {type: string}
                        status: {type: string}

components:
  schemas: {}

  securitySchemes:
    VeredictaKey:
      type: apiKey
      in: header
      name: X-Veredicta-Key

security:
  - VeredictaKey: []
