name: Admin dashboard shows test cases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-show-test-cases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch admin case scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/index.js')
          s=p.read_text(encoding='utf-8')
          old="""    const runId=String(req.query?.run_id||'').trim();
    const environment=String(req.query?.environment||'').trim();
    // O painel normal exibe produção. Testes históricos/ativos só entram por filtro explícito.
    const scopeFilter=runId
      ? `&run_id=eq.${encodeURIComponent(runId)}`
      : `&environment=eq.${encodeURIComponent(environment==='test'?'test':'production')}`;
"""
          new="""    const runId=String(req.query?.run_id||'').trim();
    const environment=String(req.query?.environment||'').trim();
    // Administradores veem produção + testes por padrão para auditar baterias cegas.
    // Usuários comuns continuam vendo somente produção. Filtros explícitos preservam o comportamento anterior.
    const explicitEnvironment=environment==='test'||environment==='production';
    const scopeFilter=runId
      ? `&run_id=eq.${encodeURIComponent(runId)}`
      : explicitEnvironment
        ? `&environment=eq.${encodeURIComponent(environment)}`
        : session.role==='admin'
          ? ''
          : '&environment=eq.production';
"""
          if old not in s:
              raise SystemExit('Target block not found; no patch applied')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js
          git commit -m 'fix: show synthetic test cases in admin dashboard'
          git push origin main
