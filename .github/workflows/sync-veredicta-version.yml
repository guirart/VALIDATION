name: Sync Veredicta 3.15.2 version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-veredicta-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync version markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'api/index.js': [("const APP_VERSION = '3.15.0';", "const APP_VERSION = '3.15.2';")],
              'openapi.yaml': [('version: 3.15.0', 'version: 3.15.2')],
              'package-lock.json': [('"version": "3.15.0"', '"version": "3.15.2"')],
          }
          for name, reps in replacements.items():
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              old = s
              for a, b in reps:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit version sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Version markers already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.js openapi.yaml package-lock.json
          git commit -m 'fix: report Veredicta 3.15.2 consistently'
          git push origin main
